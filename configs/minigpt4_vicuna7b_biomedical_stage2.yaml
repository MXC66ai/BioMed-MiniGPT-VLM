model:
  arch: minigpt4
  model_type: pretrain_vicuna0

  max_txt_len: 160
  end_sym: "###"
  prompt_path: "prompts/alignment.txt"
  prompt_template: '###Human: {} ###Assistant: '

  # Set to your Vicuna 7B path
  llama_model: "../vicuna_7b"

  # Load stage1 checkpoint
  ckpt: "output/minigpt4_vicuna7b_biomedical_stage1/checkpoint_best.pth"


datasets:
  biomedical_mixed:
    batch_size: 4
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
    sample_ratio: 1


run:
  task: image_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 3e-5
  min_lr: 1e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 10
  num_workers: 4
  warmup_steps: 200
  iters_per_epoch: 200

  seed: 42
  output_dir: "output/minigpt4_vicuna7b_biomedical_stage2"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False

  wandb_log: False
  job_name: minigpt4_biomedical_stage2
