datasets:
  biomedical_mixed:
    data_type: images

    build_info:
      annotations:
        train:
          storage:
            - ./datasets/PMC-OA/train.jsonl
            - ./datasets/PMC-VQA/Slake1.0/train.json
          dataset_types:
            - pmc_oa
            - pmc_vqa
        val:
          storage:
            - ./datasets/PMC-OA/valid.jsonl
            - ./minigpt4/datasets/PMC-VQA/Slake1.0/validate.json
          dataset_types:
            - pmc_oa
            - pmc_vqa
        test:
          storage:
            - ./minigpt4/datasets/PMC-OA/test.jsonl
            - ./minigpt4/datasets/PMC-VQA/Slake1.0/test.json
          dataset_types:
            - pmc_oa
            - pmc_vqa
      images:
        storage:
          - ./minigpt4/datasets/PMC-OA/images
          - ./minigpt4/datasets/PMC-VQA/Slake1.0

    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip2_image_eval"
        image_size: 224

    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
