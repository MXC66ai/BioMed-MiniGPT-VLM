datasets:
  pmc_oa:
    # data_type: ["images", "videos", "features"]
    data_type: images

    build_info:
      annotations:
        train:
          storage: D:/BioMed-MiniGPT-VLM/datasets/PMC-OA/train.jsonl
        val:
          storage: D:/BioMed-MiniGPT-VLM/datasets/PMC-OA/valid.jsonl
        test:
          storage: D:/BioMed-MiniGPT-VLM/datasets/PMC-OA/test.jsonl
      images:
        storage: D:/BioMed-MiniGPT-VLM/datasets/PMC-OA/images

    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip2_image_eval"
        image_size: 224

    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
