model:
  arch: minigpt4
  model_type: pretrain_vicuna0

  # vit encoder
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True
  has_qformer: True
  freeze_qformer: True

  # Q-Former
  num_query_token: 32

  # generation configs
  prompt: ""

  # Vicuna 7B model path
  llama_model: "D:/SDURA/MiniGPT-4/vicuna_7b"

  # Load final Stage 2 checkpoint
  ckpt: "D:/SDURA/MiniGPT-4/minigpt4/output/minigpt4_vicuna7b_biomedical_stage2_resume/20260723074/checkpoint_9.pth"

  max_txt_len: 160
  end_sym: "###"

  prompt_path: "prompts/alignment.txt"
  prompt_template: '###Human: {} ###Assistant: '

datasets:
  pmc_vqa:
    data_type: images
    build_info:
      annotations:
        train:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-VQA/Slake1.0/train.json
        val:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-VQA/Slake1.0/validate.json
        test:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-VQA/Slake1.0/test.json
      images:
        storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-VQA/Slake1.0
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip2_image_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

  pmc_oa:
    data_type: images
    build_info:
      annotations:
        train:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-OA/train.jsonl
        val:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-OA/valid.jsonl
        test:
          storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-OA/test.jsonl
      images:
        storage: D:/SDURA/MiniGPT-4/minigpt4/datasets/PMC-OA/images
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip2_image_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"

preprocess:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
        eval:
          name: "blip2_image_eval"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"

run:
  task: image_text_pretrain
  seed: 42
  output_dir: "output/biomedical_eval"
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
  num_workers: 0
  evaluate: True
  train_splits: []
  wandb_log: False
  job_name: minigpt4_biomedical_eval
